<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" role="img" aria-label="Project Relay">
  <title>Project Relay Horizontal Logo</title>
  <defs>
    <style>
      .wordmark {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: -0.02em;
        fill: #f3f1eb;
      }
    </style>
  </defs>
  
  <!-- Brand mark - tighter -->
  <g transform="translate(18 24) skewX(-14) translate(-18 -24)">
    <rect x="4" y="6" width="5.5" height="36" rx="1.2" fill="#ff6b35"/>
    <rect x="13.5" y="6" width="5.5" height="36" rx="1.2" fill="#b9f77c"/>
    <rect x="23" y="6" width="5.5" height="36" rx="1.2" fill="#79a8ff"/>
  </g>
  
  <text x="42" y="31" class="wordmark">Project Relay</text>
</svg>
