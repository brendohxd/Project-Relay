<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 40" role="img" aria-label="Project Relay">
  <title>Project Relay — Compact Header</title>
  <defs>
    <style>
      .brand {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: -0.03em;
        fill: #f3f1eb;
      }
    </style>
  </defs>

  <!-- Brand mark - smaller for topbar -->
  <g transform="translate(14 20) skewX(-14) translate(-14 -20)">
    <rect x="4" y="4" width="4.8" height="32" rx="1.1" fill="#ff6b35"/>
    <rect x="11.5" y="4" width="4.8" height="32" rx="1.1" fill="#b9f77c"/>
    <rect x="19" y="4" width="4.8" height="32" rx="1.1" fill="#79a8ff"/>
  </g>

  <text x="36" y="26.5" class="brand">Project Relay</text>
</svg>
