<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 56" role="img" aria-label="Project Relay">
  <title>Project Relay — Primary Header</title>
  <defs>
    <style>
      .brand {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: -0.035em;
        fill: #f3f1eb;
      }
    </style>
  </defs>

  <!-- Brand mark - refined proportions -->
  <g transform="translate(22 28) skewX(-14) translate(-22 -28)">
    <rect x="6" y="8" width="6.5" height="40" rx="1.4" fill="#ff6b35"/>
    <rect x="16.5" y="8" width="6.5" height="40" rx="1.4" fill="#b9f77c"/>
    <rect x="27" y="8" width="6.5" height="40" rx="1.4" fill="#79a8ff"/>
  </g>

  <!-- Wordmark -->
  <text x="52" y="36" class="brand">Project Relay</text>
</svg>
