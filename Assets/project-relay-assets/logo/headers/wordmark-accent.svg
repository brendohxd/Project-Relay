<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" role="img" aria-label="Project Relay">
  <title>Project Relay — Accent Header</title>
  <defs>
    <style>
      .brand {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: -0.035em;
        fill: #f3f1eb;
      }
    </style>
  </defs>

  <!-- Brand mark -->
  <g transform="translate(22 26) skewX(-14) translate(-22 -26)">
    <rect x="6" y="6" width="6.5" height="38" rx="1.4" fill="#ff6b35"/>
    <rect x="16.5" y="6" width="6.5" height="38" rx="1.4" fill="#b9f77c"/>
    <rect x="27" y="6" width="6.5" height="38" rx="1.4" fill="#79a8ff"/>
  </g>

  <text x="52" y="34" class="brand">Project Relay</text>

  <!-- Three-color accent line under the text -->
  <g transform="translate(52 44)">
    <rect x="0" y="0" width="72" height="2.5" rx="1.2" fill="#ff6b35"/>
    <rect x="76" y="0" width="72" height="2.5" rx="1.2" fill="#b9f77c"/>
    <rect x="152" y="0" width="72" height="2.5" rx="1.2" fill="#79a8ff"/>
  </g>
</svg>
