<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 28" role="img" aria-label="Deferred">
  <title>Deferred</title>
  <defs>
    <style>
      .label {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.04em;
        fill: #a7a49a;
      }
    </style>
  </defs>
  
  <!-- Pill background - muted outline -->
  <rect x="0.5" y="0.5" width="117" height="27" rx="13.5" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
  
  <!-- Mini brand bars - dashed / muted -->
  <g transform="translate(14 14) skewX(-12) translate(-14 -14)">
    <rect x="8" y="7" width="3" height="14" rx="0.8" fill="none" stroke="#a7a49a" stroke-width="1.2" stroke-dasharray="2 1.5"/>
    <rect x="13" y="7" width="3" height="14" rx="0.8" fill="none" stroke="#a7a49a" stroke-width="1.2" stroke-dasharray="2 1.5"/>
    <rect x="18" y="7" width="3" height="14" rx="0.8" fill="none" stroke="#a7a49a" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  </g>
  
  <text x="34" y="18.5" class="label">DEFERRED</text>
</svg>
