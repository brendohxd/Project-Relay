<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Projection">
  <title>Projection — rebuildable view, not authority</title>
  <!-- Source (Git) to multiple projections -->
  <circle cx="14" cy="24" r="6" fill="none" stroke="#f3f1eb" stroke-width="2"/>
  <text x="14" y="27" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#f3f1eb">G</text>
  <!-- Projection rays -->
  <path d="M20 20 L34 12" stroke="#a7a49a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M20 24 L36 24" stroke="#a7a49a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M20 28 L34 36" stroke="#a7a49a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Projection surfaces -->
  <rect x="34" y="8" width="8" height="8" rx="1.5" fill="none" stroke="#79a8ff" stroke-width="1.5"/>
  <rect x="36" y="20" width="8" height="8" rx="1.5" fill="none" stroke="#b9f77c" stroke-width="1.5"/>
  <rect x="34" y="32" width="8" height="8" rx="1.5" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
</svg>
