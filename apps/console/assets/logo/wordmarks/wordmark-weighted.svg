<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" role="img" aria-label="Project Relay">
  <title>Project Relay — Weighted Header</title>
  <defs>
    <style>
      .project {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 500;
        font-size: 26px;
        letter-spacing: -0.02em;
        fill: #a7a49a;
      }
      .relay {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: -0.035em;
        fill: #f3f1eb;
      }
    </style>
  </defs>

  <!-- Brand mark -->
  <g transform="translate(22 28) skewX(-14) translate(-22 -28)">
    <rect x="6" y="8" width="6.5" height="40" rx="1.4" fill="#ff6b35"/>
    <rect x="16.5" y="8" width="6.5" height="40" rx="1.4" fill="#b9f77c"/>
    <rect x="27" y="8" width="6.5" height="40" rx="1.4" fill="#79a8ff"/>
  </g>

  <!-- Natural word spacing (tspan flow) — matches CSS weighted preview -->
  <text x="52" y="35.5">
    <tspan class="project">Project </tspan><tspan class="relay">Relay</tspan>
  </text>
</svg>
