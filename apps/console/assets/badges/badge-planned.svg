    <rect x="8" y="7" width="3" height="14" rx="0.8" fill="none" stroke="#79a8ff" stroke-width="1.3"/>
    <rect x="13" y="7" width="3" height="14" rx="0.8" fill="none" stroke="#79a8ff" stroke-width="1.3"/>
    <rect x="18" y="7" width="3" height="14" rx="0.8" fill="none" stroke="#79a8ff" stroke-width="1.3"/>
  </g>
  
  <text x="34" y="18.5" class="label">PLANNED</text>
</svg>
