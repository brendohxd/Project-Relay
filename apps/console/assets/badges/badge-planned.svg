<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 28" role="img" aria-label="Planned">
  <title>Planned</title>
  <defs>
    <style>
      .label {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.04em;
        fill: #79a8ff;
      }
    </style>
  </defs>
  
  <!-- Pill background - dark with blue outline -->
