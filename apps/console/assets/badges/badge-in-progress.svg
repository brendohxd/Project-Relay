<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 28" role="img" aria-label="In Progress">
  <title>In Progress</title>
  <defs>
    <style>
      .label {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.04em;
        fill: #0b0d0e;
      }
    </style>
  </defs>
  
  <!-- Pill background - orange solid -->
  <rect x="0.5" y="0.5" width="131" height="27" rx="13.5" fill="#ff6b35" stroke="#e85a28" stroke-width="1"/>
  
  <!-- Mini brand bars showing progress: full, partial, empty -->
  <g transform="translate(14 14) skewX(-12) translate(-14 -14)">
    <rect x="8" y="7" width="3" height="14" rx="0.8" fill="#0b0d0e"/>
    <rect x="13" y="7" width="3" height="14" rx="0.8" fill="#0b0d0e" opacity="0.55"/>
    <rect x="18" y="7" width="3" height="14" rx="0.8" fill="#0b0d0e" opacity="0.25"/>
  </g>
  
  <!-- Subtle pulse / activity indicator (dot) -->
  <circle cx="32" cy="14" r="3.5" fill="#0b0d0e" opacity="0.9"/>
  <circle cx="32" cy="14" r="5.5" fill="none" stroke="#0b0d0e" stroke-width="1.2" opacity="0.4"/>
  
  <text x="44" y="18.5" class="label">IN PROGRESS</text>
</svg>
