<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Project Relay Open Graph">
  <title>Project Relay – Evidence before consensus</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d0e"/>
      <stop offset="100%" stop-color="#12151a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#79a8ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#79a8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: 72px;
        letter-spacing: -0.03em;
        fill: #f3f1eb;
      }
      .subtitle {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 500;
        font-size: 28px;
        fill: #a7a49a;
      }
      .tag {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.06em;
        fill: #b9f77c;
        text-transform: uppercase;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  
  <!-- Large brand mark -->
  <g transform="translate(180 280) skewX(-14) translate(-180 -280)">
    <rect x="120" y="160" width="28" height="180" rx="4" fill="#ff6b35"/>
    <rect x="170" y="160" width="28" height="180" rx="4" fill="#b9f77c"/>
    <rect x="220" y="160" width="28" height="180" rx="4" fill="#79a8ff"/>
  </g>
  
  <!-- Text -->
  <text x="320" y="250" class="title">Project Relay</text>
  <text x="320" y="310" class="subtitle">One record for work across many minds.</text>
  
  <!-- Status line -->
  <rect x="320" y="360" width="14" height="14" rx="7" fill="#b9f77c"/>
  <text x="348" y="372" class="tag">Protocol pre-alpha · M2</text>
  
  <!-- Bottom principle chips -->
  <g transform="translate(320 480)">
    <rect x="0" y="0" width="160" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="80" y="24" text-anchor="middle" class="tag" style="font-size:13px; fill:#f3f1eb;">Model neutral</text>
    
    <rect x="180" y="0" width="160" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="260" y="24" text-anchor="middle" class="tag" style="font-size:13px; fill:#f3f1eb;">Evidence first</text>
    
    <rect x="360" y="0" width="180" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="450" y="24" text-anchor="middle" class="tag" style="font-size:13px; fill:#f3f1eb;">Human accountable</text>
  </g>
</svg>
