<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Slack control room">
  <title>Slack — thread / chat projection</title>
  <!-- Abstract chat bubbles / thread -->
  <rect x="8" y="10" width="22" height="12" rx="3" fill="none" stroke="#ff6b35" stroke-width="1.8"/>
  <rect x="18" y="26" width="22" height="12" rx="3" fill="none" stroke="#b9f77c" stroke-width="1.8"/>
  <!-- Thread connector -->
  <path d="M19 22 L19 26" stroke="#a7a49a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Message lines -->
  <line x1="12" y1="15" x2="24" y2="15" stroke="#a7a49a" stroke-width="1.3"/>
  <line x1="22" y1="31" x2="34" y2="31" stroke="#a7a49a" stroke-width="1.3"/>
</svg>
