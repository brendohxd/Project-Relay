  <rect x="12" y="8" width="24" height="32" rx="2" fill="none" stroke="#79a8ff" stroke-width="2"/>
  <line x1="16" y1="16" x2="32" y2="16" stroke="#a7a49a" stroke-width="1.5"/>
  <line x1="16" y1="22" x2="28" y2="22" stroke="#a7a49a" stroke-width="1.5"/>
  <line x1="16" y1="28" x2="30" y2="28" stroke="#a7a49a" stroke-width="1.5"/>
  <!-- Database row indicator -->
  <rect x="16" y="34" width="16" height="3" rx="1" fill="#79a8ff" opacity="0.6"/>
