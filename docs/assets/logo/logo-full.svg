<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-label="Project Relay">
  <title>Project Relay Logo</title>
  <defs>
    <style>
      .wordmark {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: -0.02em;
        fill: #f3f1eb;
      }
      .tagline {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 500;
        font-size: 11px;
        letter-spacing: 0.08em;
        fill: #a7a49a;
        text-transform: uppercase;
      }
    </style>
  </defs>
  
  <!-- Brand mark -->
  <g transform="translate(28 36) skewX(-14) translate(-28 -36)">
    <rect x="8" y="12" width="7" height="48" rx="1.5" fill="#ff6b35"/>
    <rect x="20" y="12" width="7" height="48" rx="1.5" fill="#b9f77c"/>
    <rect x="32" y="12" width="7" height="48" rx="1.5" fill="#79a8ff"/>
  </g>
  
  <!-- Wordmark -->
  <text x="58" y="42" class="wordmark">Project Relay</text>
  <!-- Optional subtle tagline under for some uses -->
  <!-- <text x="58" y="58" class="tagline">Evidence before consensus</text> -->
</svg>
