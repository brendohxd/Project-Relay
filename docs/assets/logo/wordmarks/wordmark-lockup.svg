<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-label="Project Relay">
  <title>Project Relay — Full Lockup</title>
  <defs>
    <style>
      .brand {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: 32px;
        letter-spacing: -0.04em;
        fill: #f3f1eb;
      }
      .tag {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 500;
        font-size: 12px;
        letter-spacing: 0.06em;
        fill: #a7a49a;
      }
    </style>
  </defs>

  <!-- Larger brand mark for hero / lockup use -->
  <g transform="translate(26 30) skewX(-14) translate(-26 -30)">
    <rect x="6" y="6" width="8" height="48" rx="1.6" fill="#ff6b35"/>
    <rect x="19" y="6" width="8" height="48" rx="1.6" fill="#b9f77c"/>
    <rect x="32" y="6" width="8" height="48" rx="1.6" fill="#79a8ff"/>
  </g>

  <text x="58" y="36" class="brand">Project Relay</text>
  <text x="58" y="56" class="tag">One record · Many minds</text>
</svg>
