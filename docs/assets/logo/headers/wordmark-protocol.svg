<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 56" role="img" aria-label="Project Relay">
  <title>Project Relay — Protocol Header</title>
  <defs>
    <style>
      .brand {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: -0.03em;
        fill: #f3f1eb;
      }
      .meta {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 500;
        font-size: 11px;
        letter-spacing: 0.08em;
        fill: #a7a49a;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Brand mark -->
  <g transform="translate(20 28) skewX(-14) translate(-20 -28)">
    <rect x="5" y="8" width="6" height="40" rx="1.3" fill="#ff6b35"/>
    <rect x="14.5" y="8" width="6" height="40" rx="1.3" fill="#b9f77c"/>
    <rect x="24" y="8" width="6" height="40" rx="1.3" fill="#79a8ff"/>
  </g>

  <text x="48" y="28" class="brand">Project Relay</text>
  <text x="48" y="46" class="meta">Evidence before consensus</text>
</svg>
